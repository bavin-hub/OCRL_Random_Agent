[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrl-world-model"
version = "0.1.0"
description = "Experimental online world-model learning for Unitree G1"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ocrl-train = "ocrl.cli.train:main"
ocrl-evaluate = "ocrl.cli.evaluate:main"
